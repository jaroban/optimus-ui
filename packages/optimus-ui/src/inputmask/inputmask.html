<input
    #input
    pInputText
    [pt]="ptm('pcInputText', ptmParams())"
    [unstyled]="unstyled()"
    [attr.id]="inputId"
    [attr.type]="type"
    [attr.name]="name()"
    [invalid]="invalid()"
    [class]="styleClass"
    [ngStyle]="style"
    [attr.placeholder]="placeholder"
    [attr.title]="title"
    [pSize]="size()"
    [attr.size]="inputSize()"
    [attr.autocomplete]="autocomplete"
    [attr.maxlength]="maxlength()"
    [attr.minlength]="minlength()"
    [attr.tabindex]="tabindex"
    [attr.aria-label]="ariaLabel"
    [attr.aria-labelledBy]="ariaLabelledBy"
    [attr.aria-required]="ariaRequired"
    [attr.required]="required() ? '' : undefined"
    [attr.readonly]="readonly ? '' : undefined"
    [attr.disabled]="$disabled() ? '' : undefined"
    (focus)="onInputFocus($event)"
    (blur)="onInputBlur($event)"
    (keydown)="onInputKeydown($event)"
    (keypress)="onKeyPress($event)"
    [variant]="$variant()"
    [pAutoFocus]="autofocus"
    (input)="onInputChange($event)"
    (paste)="handleInputChange($event)"
    [fluid]="hasFluid"
/>
@if (value != null && $filled() && showClear && !$disabled()) { @if (!clearIconTemplate && !_clearIconTemplate) {
<svg data-p-icon="times" [class]="cx('clearIcon')" [pBind]="ptm('clearIcon')" (click)="clear()"></svg>
} @if (clearIconTemplate || _clearIconTemplate) {
<span [class]="cx('clearIcon')" [pBind]="ptm('clearIcon')" (click)="clear()">
    <ng-template *ngTemplateOutlet="clearIconTemplate || _clearIconTemplate"></ng-template>
</span>
} }
