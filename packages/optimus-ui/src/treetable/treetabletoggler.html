<button
    type="button"
    [class]="cx('toggler')"
    [pBind]="ptm('rowToggleButton')"
    (click)="onClick($event)"
    tabindex="-1"
    pRipple
    [style.visibility]="rowNode.node.leaf === false || (rowNode.node.children && rowNode.node.children.length) ? 'visible' : 'hidden'"
    [style.marginInlineStart]="rowNode.level * 16 + 'px'"
    [attr.data-pc-group-section]="'rowactionbutton'"
    [attr.aria-label]="toggleButtonAriaLabel"
>
    @if (!tt.togglerIconTemplate && !tt._togglerIconTemplate) { @if (rowNode.node.expanded) {
    <svg data-p-icon="chevron-down" [pBind]="ptm('nodetoggleicon')" [attr.aria-hidden]="true"></svg>
    } @if (!rowNode.node.expanded) {
    <svg data-p-icon="chevron-right" [pBind]="ptm('nodetoggleicon')" [attr.aria-hidden]="true"></svg>
    } }
    <ng-template *ngTemplateOutlet="tt.togglerIconTemplate || tt._togglerIconTemplate; context: { $implicit: rowNode.node.expanded }"></ng-template>
</button>
