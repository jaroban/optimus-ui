<input
    #input
    [attr.id]="inputId"
    type="checkbox"
    [attr.value]="value"
    [attr.name]="name()"
    [checked]="checked"
    [attr.tabindex]="tabindex"
    [attr.required]="required() ? '' : undefined"
    [attr.readonly]="readonly ? '' : undefined"
    [attr.disabled]="$disabled() ? '' : undefined"
    [attr.aria-labelledby]="ariaLabelledBy"
    [attr.aria-label]="ariaLabel"
    [style]="inputStyle"
    [class]="cn(cx('input'), inputClass)"
    [pBind]="ptm('input')"
    (focus)="onInputFocus($event)"
    (blur)="onInputBlur($event)"
    (change)="handleChange($event)"
/>
<div [class]="cx('box')" [pBind]="ptm('box')" [attr.data-p]="dataP">
    @if (!checkboxIconTemplate && !_checkboxIconTemplate) { @if (checked) { @if (checkboxIcon) {
    <span [class]="cx('icon')" [ngClass]="checkboxIcon" [pBind]="ptm('icon')" [attr.data-p]="dataP"></span>
    } @if (!checkboxIcon) {
    <svg data-p-icon="check" [class]="cx('icon')" [pBind]="ptm('icon')" [attr.data-p]="dataP"></svg>
    } } @if (_indeterminate()) {
    <svg data-p-icon="minus" [class]="cx('icon')" [pBind]="ptm('icon')" [attr.data-p]="dataP"></svg>
    } }
    <ng-template *ngTemplateOutlet="checkboxIconTemplate || _checkboxIconTemplate; context: { checked: checked, class: cx('icon'), dataP: dataP }"></ng-template>
</div>
