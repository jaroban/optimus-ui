<ng-content />
@if (toggleicon) {
<ng-template *ngTemplateOutlet="toggleicon; context: { active: active() }"></ng-template>
} @else { @if (active()) { @if (pcAccordion.collapseIcon) {
<span [class]="cn(cx('toggleicon'), pcAccordion.collapseIcon)" [attr.aria-hidden]="true" [pBind]="ptm('toggleicon')"></span>
} @if (!pcAccordion.collapseIcon) {
<svg data-p-icon="chevron-up" [class]="cx('toggleicon')" [pBind]="ptm('toggleicon')" [attr.aria-hidden]="true"></svg>
} } @if (!active()) { @if (pcAccordion.expandIcon) {
<span [class]="cn(cx('toggleicon'), pcAccordion.expandIcon)" [attr.aria-hidden]="true" [pBind]="ptm('toggleicon')"></span>
} @if (!pcAccordion.expandIcon) {
<svg data-p-icon="chevron-down" [attr.aria-hidden]="true" [pBind]="ptm('toggleicon')"></svg>
} } }
